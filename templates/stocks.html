<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks - Stock Management System</title>

    <!-- Roboto Font & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

    <style>
        /* General Styles */
        body {
            font-family: "Roboto", sans-serif;
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #1f2937;
            padding: 30px;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #3b4c61;
        }

        .sidebar h2 {
            color: #f9fafb;
            text-align: center;
            font-size: 2.2em;
            font-weight: 500;
            margin-bottom: 40px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 20px 0;
        }

        .sidebar ul li a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            padding: 16px 18px;
            border-radius: 8px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .sidebar ul li a i {
            margin-right: 25px;
            font-size: 1.3em;
        }

        .sidebar ul li a:hover {
            background: #4b8b8c;
            color: #ffffff;
        }

        .logout {
            color: #f87171;
        }

        /* Main Content */
        .content {
            margin-left: 550px;
            padding: 40px;
            background: #ffffff;
            flex-grow: 1;
            border-left: 2px solid #e5e7eb;
        }

        .content h2 {
            font-size: 2em;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* Stocks Container */
        .stocks-container {
            width: 100%;
            margin: 20px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Search Section */
        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .search-container input {
            padding: 10px;
            width: 200px;
            margin-right: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
        }

        .search-container button {
            padding: 10px;
            background: #bb86fc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-container button:hover {
            background: #9b59ff;
        }

        /* Stock Actions */
        .stock-actions {
            margin-bottom: 30px;
        }

        .stock-actions h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        .stock-actions form {
            display: grid;
            grid-gap: 10px;
        }

        .stock-actions input,
        .stock-actions select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
        }

        .stock-actions button {
            background: #bb86fc;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .stock-actions button:hover {
            background: #9b59ff;
        }

        /* Stock List Table */
        .stocks-list table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            text-align: left;
        }

        .stocks-list th, .stocks-list td {
            padding: 12px;
            border: 1px solid #333;
        }

        .stocks-list th {
            background: #222;
            color: #fff;
        }

        .stocks-list td {
            background: #1e1e1e;
        }

        .stocks-list button {
            background: #e74c3c;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .stocks-list button:hover {
            background: #c0392b;
        }

        /* Critical Stock Alert */
        .critical-stock {
            background-color: #e74c3c;
            color: #fff;
            text-align: center;
            padding: 5px;
            font-weight: bold;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 220px;
                padding: 20px;
            }

            .content {
                margin-left: 240px;
                padding: 30px;
            }

            .stocks-container {
                padding: 20px;
            }

            .search-container input {
                width: 150px;
            }

            .stocks-list button {
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
                padding: 20px;
            }

            .content {
                margin-left: 0;
                padding: 20px;
            }

            .stocks-container {
                padding: 15px;
            }

            .search-container input {
                width: 100%;
                margin-right: 0;
            }

            .stocks-list button {
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2>Gestion de Stock</h2>
            <ul>
                <li><a href="{% url 'stocks_view' %}"><i class="fas fa-box"></i> Stocks</a></li>
                <li><a href="{% url 'articles_view' %}"><i class="fas fa-file-alt"></i> Articles</a></li>
                <li><a href="{% url 'rapports_view' %}"><i class="fas fa-chart-line"></i> Rapports</a></li>
                <li><a href="#" class="logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="stocks-container">
                <h2>Gestion des Stocks</h2>

                <!-- Search Section -->
                <div class="search-container">
                    <input type="text" id="search-bar" placeholder="Rechercher un article par référence ou nom">
                    <button id="search-btn">Rechercher</button>
                </div>

                <!-- Stock Entry/Exit Section -->
                <div class="stock-actions">
                    <h3>Enregistrer Entrée/Sortie de Stock</h3>
                    <form id="stock-form">
                        <label for="article">Sélectionner un Article</label>
                        <select id="article" name="article" required>
                            <option value="">Choisir un article</option>
                            <!-- Dynamic article options will go here -->
                        </select>

                        <label for="action">Action</label>
                        <select id="action" name="action" required>
                            <option value="entry">Entrée</option>
                            <option value="exit">Sortie</option>
                        </select>

                        <label for="quantity">Quantité</label>
                        <input type="number" id="quantity" name="quantity" placeholder="Quantité" required>

                        <button type="submit">Enregistrer l'Action</button>
                    </form>
                </div>

                <!-- Stocks List -->
                <div class="stocks-list">
                    <h3>Liste des Stocks</h3>
                    <table id="stocks-table">
                        <thead>
                            <tr>
                                <th>Nom de l'Article</th>
                                <th>Référence</th>
                                <th>Quantité Disponible</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dynamic stock list will go here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
