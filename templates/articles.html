<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles - Stock Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

    <style>
        body {
            font-family: "Roboto", sans-serif;
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #1f2937;
            padding: 30px;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #3b4c61;
        }

        .sidebar h2 {
            color: #f9fafb;
            text-align: center;
            font-size: 2.2em;
            font-weight: 500;
            margin-bottom: 40px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 20px 0;
        }

        .sidebar ul li a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            padding: 16px 18px;
            border-radius: 8px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .sidebar ul li a i {
            margin-right: 25px;
            font-size: 1.3em;
        }

        .sidebar ul li a:hover {
            background: #4b8b8c;
            color: #ffffff;
        }

        .logout {
            color: #f87171;
        }

        /* Main Content */
        .content {
            margin-left: 600px;
            padding: 50px 40px;
            background: #ffffff;
            flex-grow: 1;
        }

        h2 {
            font-size: 2em;
            font-weight: 500;
            margin-bottom: 20px;
            color: #4b8b8c;
        }

        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .search-container input {
            padding: 10px;
            width: 200px;
            margin-right: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
        }

        .search-container button {
            padding: 10px;
            background: #bb86fc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-container button:hover {
            background: #9b59ff;
        }

        .add-article {
            margin-bottom: 30px;
        }

        .add-article h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #374151;
        }

        .add-article form {
            display: grid;
            grid-gap: 10px;
        }

        .add-article input,
        .add-article select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
        }

        .add-article button {
            background: #bb86fc;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-article button:hover {
            background: #9b59ff;
        }

        .articles-list table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            text-align: left;
        }

        .articles-list th, .articles-list td {
            padding: 12px;
            border: 1px solid #333;
        }

        .articles-list th {
            background: #222;
            color: #f9fafb;
        }

        .articles-list td {
            background: #1e1e1e;
            color: #f9fafb;
        }

        .articles-list button {
            background: #e74c3c;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .articles-list button:hover {
            background: #c0392b;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 220px;
                padding: 20px;
            }

            .content {
                margin-left: 240px;
            }

            .articles-list table {
                margin-top: 20px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
                padding: 20px;
            }

            .content {
                margin-left: 0;
            }

            .articles-list table {
                margin-top: 20px;
            }
        }

    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2>Gestion de Stock</h2>
            <ul>
                <li><a href="{% url 'stocks_view' %}"><i class="fas fa-box"></i> Stocks</a></li>
                <li><a href="{% url 'articles_view' %}"><i class="fas fa-file-alt"></i> Articles</a></li>
                <li><a href="{% url 'rapports_view' %}"><i class="fas fa-chart-line"></i> Rapports</a></li>
                <li><a href="" class="logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="articles-container">
                <h2>Gestion des Articles</h2>

                <!-- Search Section -->
                <div class="search-container">
                    <input type="text" id="search-bar" placeholder="Rechercher un article par référence ou nom">
                    <button id="search-btn">Rechercher</button>
                </div>

                <!-- Add Article Section -->
                <div class="add-article">
                    <h3>Ajouter un Nouvel Article</h3>
                    <form id="add-article-form">
                        <label for="name">Nom</label>
                        <input type="text" id="name" name="name" placeholder="Nom de l'article" required>
                        
                        <label for="reference">Référence</label>
                        <input type="text" id="reference" name="reference" placeholder="Référence de l'article" required>
                        
                        <label for="category">Catégorie</label>
                        <input type="text" id="category" name="category" placeholder="Catégorie de l'article" required>
                        
                        <label for="price">Prix</label>
                        <input type="number" id="price" name="price" placeholder="Prix de l'article" required>
                        
                        <label for="quantity">Quantité Initiale</label>
                        <input type="number" id="quantity" name="quantity" placeholder="Quantité initiale" required>

                        <button type="submit">Ajouter l'Article</button>
                    </form>
                </div>

                <!-- Articles List -->
                <div class="articles-list">
                    <h3>Liste des Articles</h3>
                    <table id="articles-table">
                        <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Référence</th>
                                <th>Catégorie</th>
                                <th>Prix</th>
                                <th>Quantité</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Articles will be dynamically added here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
